[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_kids"
version = "0.1.0"
description = "Voice conversation app for Reachy Mini with a kids mode, powered by OpenAI Realtime or xAI Grok Voice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "reachy-mini>=1.11.0",
    "fastapi",
    "numpy>=2.0",
    "platformdirs",
    "scipy>=1.11",
    "websockets>=13,<16",
]
keywords = ["reachy-mini-app"]

[project.optional-dependencies]
sim = ["reachy-mini[mujoco]>=1.11.0"]

[project.scripts]
reachy-kids = "reachy_kids.cli:main"

[project.entry-points."reachy_mini_apps"]
reachy_kids = "reachy_kids.main:ReachyKids"

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["reachy_kids*"]

[tool.setuptools.package-data]
reachy_kids = ["static/*"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4", "D"]
ignore = ["D100", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
known-first-party = ["reachy_kids"]

[tool.mypy]
python_version = "3.12"
files = ["reachy_kids/"]
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
