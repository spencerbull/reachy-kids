<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reachy Kids</title>
    <link rel="icon" href="/static/icon.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <img src="/static/icon.svg" alt="" class="logo">
        <div>
            <h1>Reachy Kids</h1>
            <p class="subtitle">A friendly voice for your Reachy Mini</p>
        </div>
    </header>

    <main>
        <section class="card status-card">
            <div id="orb" class="orb" data-state="starting"></div>
            <div>
                <p id="status-label" class="status-label">Starting…</p>
                <p id="status-detail" class="status-detail"></p>
            </div>
            <button id="restart" class="ghost" type="button">Restart conversation</button>
        </section>

        <section class="card">
            <h2>Conversation</h2>
            <ol id="transcript" class="transcript">
                <li class="empty">Nothing yet. Say hello to Reachy!</li>
            </ol>
        </section>

        <form id="settings" class="card">
            <h2>Settings</h2>

            <label class="toggle">
                <input type="checkbox" name="kids_mode">
                <span>
                    <strong>Kids mode</strong>
                    <small>Kid-safe answers, slower speech, and patient listening that waits for little voices.</small>
                </span>
            </label>

            <div class="grid">
                <label>Voice service
                    <select name="provider">
                        <option value="openai">OpenAI Realtime</option>
                        <option value="xai">xAI Grok Voice</option>
                    </select>
                </label>
                <label>Voice
                    <select name="voice"></select>
                </label>
            </div>

            <label data-provider="openai">OpenAI API key
                <input type="password" name="openai_api_key" autocomplete="off" placeholder="sk-…">
            </label>
            <label data-provider="xai">xAI API key
                <input type="password" name="xai_api_key" autocomplete="off" placeholder="xai-…">
            </label>

            <div class="grid kids-only">
                <label>Child's first name <small>(optional, helps Reachy hear it)</small>
                    <input type="text" name="child_name" maxlength="40">
                </label>
                <label>Age <small>(optional)</small>
                    <input type="number" name="child_age" min="1" max="17">
                </label>
            </div>

            <div class="grid">
                <label>Language
                    <input type="text" name="language" maxlength="10" placeholder="en">
                </label>
                <label>Words to listen for <small>(comma separated)</small>
                    <input type="text" name="keyterms" placeholder="dinosaur, Pikachu, Grandma">
                </label>
            </div>

            <div class="actions">
                <button type="submit">Save</button>
                <span id="save-status" role="status"></span>
            </div>
        </form>
    </main>

    <script src="/static/app.js"></script>
</body>

</html>
